apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: webserver
spec:
  replicas: 1

  selector:
    matchLabels:
      app: hello-world

  template:
    metadata:
      labels:
        app: hello-world

    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine

          ports:
            - containerPort: 80

          env:
            - name: SECRET_MESSAGE
              valueFrom:
                secretKeyRef:
                  name: hello-world-secret
                  key: SECRET_MESSAGE

          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html

      volumes:
        - name: html
          configMap:
            name: hello-world-config